<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Box Annotator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  .toolbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: #16213e; border-bottom: 1px solid #333;
  }
  .toolbar label { font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .toolbar input[type="color"] { width: 32px; height: 26px; border: none; cursor: pointer; background: none; }
  .toolbar input[type="range"] { width: 80px; }
  .toolbar input[type="text"] { width: 100px; padding: 3px 6px; background: #0f3460; border: 1px solid #555; color: #e0e0e0; border-radius: 3px; font-size: 13px; }
  .toolbar button {
    padding: 5px 12px; background: #0f3460; border: 1px solid #555; color: #e0e0e0;
    border-radius: 3px; cursor: pointer; font-size: 13px;
  }
  .toolbar button:hover { background: #1a5276; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .canvas-wrap {
    flex: 1; position: relative; overflow: auto; display: flex;
    align-items: center; justify-content: center; background: #111;
  }
  .canvas-wrap.dragover { outline: 3px dashed #53a8b6; outline-offset: -10px; }
  .canvas-wrap .placeholder {
    color: #666; font-size: 18px; text-align: center; pointer-events: none;
  }
  canvas { cursor: crosshair; display: block; }

  .sidebar {
    width: 300px; background: #16213e; border-left: 1px solid #333;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar h3 { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #333; }
  .box-list { flex: 1; overflow-y: auto; padding: 8px; }
  .box-item {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: #0f3460; border-radius: 4px; margin-bottom: 4px; font-size: 12px;
  }
  .box-item .swatch { width: 16px; height: 16px; border-radius: 2px; flex-shrink: 0; }
  .box-item .info { flex: 1; }
  .box-item button { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 14px; padding: 0 4px; }
  .box-item button:hover { color: #ff6b6b; }

  .sidebar-actions {
    padding: 10px 12px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 6px;
  }
  .sidebar-actions button {
    width: 100%; padding: 7px; background: #0f3460; border: 1px solid #555;
    color: #e0e0e0; border-radius: 3px; cursor: pointer; font-size: 13px;
  }
  .sidebar-actions button:hover { background: #1a5276; }
  .sidebar-actions button.primary { background: #1a5276; border-color: #53a8b6; }

  .status { padding: 6px 16px; background: #16213e; border-top: 1px solid #333; font-size: 12px; color: #888; }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btnLoad" title="Load image">Load Image</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <label>Color: <input type="color" id="boxColor" value="#FFFF00"></label>
  <label>Opacity: <input type="range" id="boxOpacity" min="0.1" max="0.8" step="0.05" value="0.3"></label>
  <label>Label: <input type="text" id="boxLabel" placeholder="e.g. 4202_7"></label>
  <button id="btnUndo" title="Undo last box">Undo</button>
  <button id="btnExport" title="Export annotated image">Export PNG</button>
</div>

<div class="main">
  <div class="canvas-wrap" id="canvasWrap">
    <div class="placeholder" id="placeholder">Drop an image here or click "Load Image"</div>
    <canvas id="canvas" style="display:none"></canvas>
  </div>
  <div class="sidebar">
    <h3>Boxes (<span id="boxCount">0</span>)</h3>
    <div class="box-list" id="boxList"></div>
    <div class="sidebar-actions">
      <button class="primary" id="btnCopy">Copy JSON</button>
      <button id="btnClear">Clear All</button>
    </div>
  </div>
</div>

<div class="status" id="status">Ready — load an image to begin</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const placeholder = document.getElementById('placeholder');
const boxList = document.getElementById('boxList');
const boxCount = document.getElementById('boxCount');
const status = document.getElementById('status');

let img = null;
let imgName = '';
let boxes = [];
let drawing = false;
let startX = 0, startY = 0;

// --- Image loading ---
document.getElementById('btnLoad').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => { if (e.target.files[0]) loadImage(e.target.files[0]); };

wrap.ondragover = e => { e.preventDefault(); wrap.classList.add('dragover'); };
wrap.ondragleave = () => wrap.classList.remove('dragover');
wrap.ondrop = e => {
  e.preventDefault();
  wrap.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
};

function loadImage(file) {
  imgName = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    img = new Image();
    img.onload = () => {
      // Fit canvas to available space while preserving aspect ratio
      const maxW = wrap.clientWidth - 20;
      const maxH = wrap.clientHeight - 20;
      const scale = Math.min(1, maxW / img.width, maxH / img.height);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.style.display = 'block';
      placeholder.style.display = 'none';
      canvas.dataset.scale = scale;
      redraw();
      setStatus(`Loaded: ${imgName} (${img.width}x${img.height})`);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// --- Drawing ---
canvas.onmousedown = e => {
  if (!img) return;
  drawing = true;
  const r = canvas.getBoundingClientRect();
  startX = e.clientX - r.left;
  startY = e.clientY - r.top;
};

canvas.onmousemove = e => {
  if (!drawing) return;
  const r = canvas.getBoundingClientRect();
  const curX = e.clientX - r.left;
  const curY = e.clientY - r.top;
  redraw();
  // Preview rectangle
  const color = document.getElementById('boxColor').value;
  const opacity = parseFloat(document.getElementById('boxOpacity').value);
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.fillStyle = color;
  ctx.fillRect(startX, startY, curX - startX, curY - startY);
  ctx.restore();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(startX, startY, curX - startX, curY - startY);
};

canvas.onmouseup = e => {
  if (!drawing) return;
  drawing = false;
  const r = canvas.getBoundingClientRect();
  let endX = e.clientX - r.left;
  let endY = e.clientY - r.top;

  // Normalize (allow drawing in any direction)
  let x = Math.min(startX, endX);
  let y = Math.min(startY, endY);
  let w = Math.abs(endX - startX);
  let h = Math.abs(endY - startY);

  // Ignore tiny accidental clicks
  if (w < 5 && h < 5) { redraw(); return; }

  // Convert to percentages of canvas size
  const box = {
    x: +(x / canvas.width * 100).toFixed(1),
    y: +(y / canvas.height * 100).toFixed(1),
    w: +(w / canvas.width * 100).toFixed(1),
    h: +(h / canvas.height * 100).toFixed(1),
    color: document.getElementById('boxColor').value,
    opacity: parseFloat(document.getElementById('boxOpacity').value),
    label: document.getElementById('boxLabel').value || ''
  };

  boxes.push(box);
  redraw();
  updateBoxList();
  setStatus(`Box added${box.label ? ': ' + box.label : ''} — ${boxes.length} total`);
};

// --- Rendering ---
function redraw() {
  if (!img) return;
  const scale = parseFloat(canvas.dataset.scale) || 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  for (const box of boxes) {
    const bx = box.x / 100 * canvas.width;
    const by = box.y / 100 * canvas.height;
    const bw = box.w / 100 * canvas.width;
    const bh = box.h / 100 * canvas.height;

    ctx.save();
    ctx.globalAlpha = box.opacity;
    ctx.fillStyle = box.color;
    ctx.fillRect(bx, by, bw, bh);
    ctx.restore();

    ctx.strokeStyle = box.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    if (box.label) {
      ctx.save();
      ctx.font = 'bold 14px system-ui';
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.strokeText(box.label, bx + 4, by + 18);
      ctx.fillText(box.label, bx + 4, by + 18);
      ctx.restore();
    }
  }
}

// --- Box list UI ---
function updateBoxList() {
  boxCount.textContent = boxes.length;
  boxList.innerHTML = '';
  boxes.forEach((box, i) => {
    const div = document.createElement('div');
    div.className = 'box-item';
    div.innerHTML = `
      <span class="swatch" style="background:${box.color};opacity:${box.opacity}"></span>
      <span class="info">${box.label || '(no label)'} — ${box.x}%, ${box.y}% (${box.w}x${box.h}%)</span>
      <button title="Delete" data-idx="${i}">&times;</button>
    `;
    div.querySelector('button').onclick = () => { boxes.splice(i, 1); redraw(); updateBoxList(); };
    boxList.appendChild(div);
  });
}

// --- Actions ---
document.getElementById('btnUndo').onclick = () => {
  if (boxes.length === 0) return;
  boxes.pop();
  redraw();
  updateBoxList();
  setStatus(`Undo — ${boxes.length} boxes`);
};

document.getElementById('btnClear').onclick = () => {
  boxes = [];
  redraw();
  updateBoxList();
  setStatus('All boxes cleared');
};

document.getElementById('btnCopy').onclick = () => {
  const data = JSON.stringify({ image: imgName, boxes }, null, 2);
  navigator.clipboard.writeText(data).then(() => setStatus('JSON copied to clipboard'));
};

document.getElementById('btnExport').onclick = () => {
  if (!img) return;
  // Render at full resolution
  const expCanvas = document.createElement('canvas');
  expCanvas.width = img.width;
  expCanvas.height = img.height;
  const ectx = expCanvas.getContext('2d');
  ectx.drawImage(img, 0, 0);

  for (const box of boxes) {
    const bx = box.x / 100 * img.width;
    const by = box.y / 100 * img.height;
    const bw = box.w / 100 * img.width;
    const bh = box.h / 100 * img.height;

    ectx.save();
    ectx.globalAlpha = box.opacity;
    ectx.fillStyle = box.color;
    ectx.fillRect(bx, by, bw, bh);
    ectx.restore();

    ectx.strokeStyle = box.color;
    ectx.lineWidth = 3;
    ectx.strokeRect(bx, by, bw, bh);

    if (box.label) {
      ectx.save();
      const fontSize = Math.max(16, img.width * 0.025);
      ectx.font = `bold ${fontSize}px system-ui`;
      ectx.fillStyle = '#000';
      ectx.strokeStyle = '#fff';
      ectx.lineWidth = 4;
      ectx.strokeText(box.label, bx + 6, by + fontSize + 4);
      ectx.fillText(box.label, bx + 6, by + fontSize + 4);
      ectx.restore();
    }
  }

  const link = document.createElement('a');
  const base = imgName.replace(/\.[^.]+$/, '');
  link.download = `${base}_annotated.png`;
  link.href = expCanvas.toDataURL('image/png');
  link.click();
  setStatus(`Exported: ${link.download}`);
};

function setStatus(msg) { status.textContent = msg; }
</script>
</body>
</html>
